<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Claw Inspector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; }

        :root {
            --bg: #171717;
            --border: #2e2e2e;
            --text: #ececec;
            --text-secondary: #9a9a9a;
            --text-tertiary: #666;
            --surface: #212121;
            --surface-hover: #2a2a2a;
            --font: "Sora", system-ui, sans-serif;
            --mono: "JetBrains Mono", monospace;
            --sidebar-w: 260px;
            --lanes-w: 220px;
            --tool: #3a3220;
            --tool-text: #e0c674;
            --subagent: #202f3a;
            --subagent-text: #6cb6e0;
            --reasoning: #2a2035;
            --reasoning-text: #b799e0;
            --user: #20303a;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
        }

        button, input, textarea { font: inherit; border: none; background: none; color: inherit; }
        button { cursor: pointer; }

        .app {
            display: grid;
            grid-template-columns: var(--sidebar-w) var(--lanes-w) 1fr;
            height: 100vh;
        }

        /* ── Columna: sesiones ── */
        .sessions {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow: hidden;
            padding: 12px 10px;
            gap: 4px;
        }
        .brand {
            font-size: .85rem;
            font-weight: 700;
            letter-spacing: -.02em;
            padding: 4px 4px 10px;
        }
        .config-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
        }
        .config-box input {
            padding: 6px 8px;
            border-radius: 6px;
            background: #171717;
            border: 1px solid var(--border);
            font-size: .72rem;
        }
        .config-label {
            font-size: .62rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: .05em;
        }
        .section-label {
            padding: 10px 4px 6px;
            font-size: .68rem;
            font-weight: 600;
            color: var(--text-tertiary);
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .session-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        .session-item {
            width: 100%;
            text-align: left;
            padding: 9px 10px;
            border-radius: 8px;
        }
        .session-item:hover { background: var(--surface); }
        .session-item.active { background: var(--surface); }
        .session-title {
            font-size: .82rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-meta {
            font-size: .65rem;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        .empty-hint {
            padding: 16px 8px;
            font-size: .8rem;
            color: var(--text-tertiary);
            line-height: 1.5;
        }

        /* ── Columna: carriles (agentes) ── */
        .lanes-col {
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 14px 8px;
        }
        .lane-btn {
            width: 100%;
            text-align: left;
            padding: 10px 10px;
            border-radius: 8px;
            margin-bottom: 2px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .lane-btn:hover { background: var(--surface); }
        .lane-btn.active { background: var(--surface-hover); }
        .lane-name { font-size: .82rem; font-weight: 600; }
        .lane-count { font-size: .68rem; color: var(--text-tertiary); }
        .lane-btn.main .lane-name::before { content: "★ "; color: #e0c674; }

        /* ── Columna: timeline ── */
        .timeline-wrap {
            overflow-y: auto;
            padding: 20px;
        }
        .timeline {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .placeholder {
            margin-top: 20vh;
            text-align: center;
            color: var(--text-tertiary);
            font-size: .9rem;
        }

        .card {
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 10px 12px;
        }
        .card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .74rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .card-body {
            margin-top: 6px;
            font-size: .85rem;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .card.message.user { background: var(--user); border-color: #2a4552; }
        .card.message.assistant { background: var(--surface); }

        .card.reasoning { background: var(--reasoning); border-color: #3a2e4a; }
        .card.reasoning .card-head { color: var(--reasoning-text); }
        .card.reasoning .card-body { color: #cbb8e0; font-style: italic; }

        .card.tool_call { background: var(--tool); border-color: #4a3f24; }
        .card.tool_call .card-head { color: var(--tool-text); }

        .card.subagent_call { background: var(--subagent); border-color: #274456; cursor: pointer; }
        .card.subagent_call .card-head { color: var(--subagent-text); }
        .card.subagent_call:hover { border-color: #3a6a8a; }

        details { margin-top: 6px; }
        summary {
            cursor: pointer;
            font-size: .7rem;
            color: var(--text-tertiary);
            padding: 2px 0;
        }
        pre.json {
            margin-top: 4px;
            padding: 8px 10px;
            background: #111;
            border-radius: 8px;
            font-family: var(--mono);
            font-size: .74rem;
            overflow-x: auto;
            color: #d4d4d4;
        }

        .jump-btn {
            margin-top: 6px;
            font-size: .7rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,.06);
            color: var(--subagent-text);
        }
        .jump-btn:hover { background: rgba(255,255,255,.12); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 99px; }

        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; }
            .sessions, .lanes-col { display: none; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="app">
        <aside class="sessions">
            <div class="brand">Multi-Claw Inspector</div>

            <div class="config-box">
                <span class="config-label">API URL</span>
                <input v-model="config.apiUrl" @change="save" placeholder="http://localhost:8000">
                <span class="config-label">X-API-Key</span>
                <input v-model="config.apiKey" @change="save" type="password" placeholder="opcional">
            </div>

            <button class="lane-btn" @click="fetchSessions" style="text-align:center;">↻ Recargar sesiones</button>

            <div class="section-label">Sesiones ({{ sessions.length }})</div>
            <div class="session-list">
                <template v-if="sessions.length">
                    <button
                        v-for="s in sessions"
                        :key="s.session_id"
                        class="session-item"
                        :class="{ active: s.session_id === selectedSessionId }"
                        @click="selectSession(s.session_id)"
                    >
                        <div class="session-title">{{ s.title || s.session_id }}</div>
                        <div class="session-meta">{{ s.message_count }} msg · {{ fmtTime(s.updated_at) }}</div>
                    </button>
                </template>
                <div v-else class="empty-hint">Sin sesiones (revisa API URL / API Key).</div>
            </div>
        </aside>

        <aside class="lanes-col">
            <div class="section-label">Agentes en esta sesión</div>
            <template v-if="trace">
                <button
                    v-for="agent in trace.agents"
                    :key="agent"
                    class="lane-btn"
                    :class="{ active: agent === selectedLane, main: agent === trace.agents[0] }"
                    @click="selectedLane = agent"
                >
                    <span class="lane-name">{{ agent }}</span>
                    <span class="lane-count">{{ (trace.lanes[agent] || []).length }} eventos</span>
                </button>
            </template>
            <div v-else class="empty-hint">Selecciona una sesión.</div>
        </aside>

        <section class="timeline-wrap">
            <div v-if="loading" class="placeholder">Cargando traza…</div>
            <div v-else-if="!trace" class="placeholder">Selecciona una sesión de la izquierda para inspeccionarla.</div>
            <div v-else class="timeline">
                <article
                    v-for="(item, idx) in currentLaneItems"
                    :key="idx"
                    class="card"
                    :class="[item.kind, item.role]"
                    @click="item.kind === 'subagent_call' && item.target_agent ? selectedLane = item.target_agent : null"
                >
                    <template v-if="item.kind === 'message'">
                        <div class="card-head">{{ item.role === 'user' ? '👤 usuario' : '🤖 respuesta' }}</div>
                        <div class="card-body">{{ item.text || '(vacío)' }}</div>
                    </template>

                    <template v-else-if="item.kind === 'reasoning'">
                        <div class="card-head">🧠 razonamiento · {{ item.provider === 'anthropic' ? 'crudo (thinking)' : 'resumen (summary)' }}</div>
                        <div class="card-body">{{ item.text }}</div>
                    </template>

                    <template v-else-if="item.kind === 'tool_call'">
                        <div class="card-head">🔧 tool · {{ item.name }}</div>
                        <details>
                            <summary>argumentos</summary>
                            <pre class="json">{{ pretty(item.arguments) }}</pre>
                        </details>
                        <details>
                            <summary>resultado</summary>
                            <pre class="json">{{ pretty(item.result) }}</pre>
                        </details>
                    </template>

                    <template v-else-if="item.kind === 'subagent_call'">
                        <div class="card-head">🤖 subagente · {{ item.name }}</div>
                        <details>
                            <summary>consulta enviada</summary>
                            <pre class="json">{{ pretty(item.arguments) }}</pre>
                        </details>
                        <details>
                            <summary>respuesta recibida</summary>
                            <pre class="json">{{ pretty(item.result) }}</pre>
                        </details>
                        <button class="jump-btn" @click.stop="selectedLane = item.target_agent">Ver carril de {{ item.target_agent }} →</button>
                    </template>
                </article>
                <div v-if="!currentLaneItems.length" class="placeholder">Este carril no tiene eventos.</div>
            </div>
        </section>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            config: {
                apiUrl: localStorage.getItem("apiUrl") || window.location.origin,
                apiKey: localStorage.getItem("inspectorApiKey") || ""
            },
            sessions: [],
            selectedSessionId: null,
            trace: null,
            selectedLane: null,
            loading: false
        };
    },
    computed: {
        currentLaneItems() {
            if (!this.trace || !this.selectedLane) return [];
            return this.trace.lanes[this.selectedLane] || [];
        }
    },
    mounted() {
        this.fetchSessions();
    },
    methods: {
        save() {
            localStorage.setItem("apiUrl", this.config.apiUrl);
            localStorage.setItem("inspectorApiKey", this.config.apiKey);
        },
        headers() {
            const h = {};
            if (this.config.apiKey) h["X-API-Key"] = this.config.apiKey;
            return h;
        },
        fmtTime(v) {
            if (!v) return "";
            return new Intl.DateTimeFormat("es-ES", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }).format(new Date(v));
        },
        pretty(v) {
            if (v === null || v === undefined) return "null";
            if (typeof v === "string") return v;
            try { return JSON.stringify(v, null, 2); } catch { return String(v); }
        },
        async fetchSessions() {
            this.save();
            try {
                const r = await fetch(`${this.config.apiUrl}/conversations?limit=200`, { headers: this.headers() });
                this.sessions = r.ok ? await r.json() : [];
            } catch { this.sessions = []; }
        },
        async selectSession(sessionId) {
            this.selectedSessionId = sessionId;
            this.trace = null;
            this.selectedLane = null;
            this.loading = true;
            try {
                const r = await fetch(`${this.config.apiUrl}/conversations/${sessionId}/trace`, { headers: this.headers() });
                if (r.ok) {
                    this.trace = await r.json();
                    this.selectedLane = this.trace.agents[0] || null;
                } else {
                    this.trace = { agents: [], lanes: {} };
                }
            } catch {
                this.trace = { agents: [], lanes: {} };
            } finally {
                this.loading = false;
            }
        }
    }
}).mount("#app");
</script>
</body>
</html>
